[package]
name = "hachimi_ura"
version = "3.29.1"
edition = "2021"
authors = ["URA Plugin Developer"]
description = "Umamusume Response Analyzer - URA Blackboard Plugin for Hachimi (minimal V3)"

[lib]
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }
ureq = { version = "2", features = ["tls"] }
libc = "0.2"
# matsuri 决策栈（CI 里 vendor 到 ../vendor/matsuri，本地不提交）
#   matsuri-ai  = 在线档：帧 → 局面还原 → 路由 → 决策
#   umaai       = 引擎配置 / 帧解析（matsuri-ai 的上游）
# 这三者是 vendor 里 workspace 的成员，version/edition 从 ../vendor/matsuri/Cargo.toml
# 继承；cargo 能沿 path 向上找到 workspace root，因此可作外部 path 依赖。
matsuri-core = { path = "../vendor/matsuri/crates/matsuri-core", optional = true }
matsuri-ai = { path = "../vendor/matsuri/crates/matsuri-ai", optional = true }
umaai = { path = "../vendor/matsuri/umaai_next/crates/umaai", optional = true }
toml = { version = "0.9", optional = true }

[features]
default = []
# 打开后把完整 matsuri 决策栈（在线档）真正编进来
matsuri = ["dep:matsuri-core", "dep:matsuri-ai", "dep:umaai", "dep:toml"]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"
codegen-units = 1