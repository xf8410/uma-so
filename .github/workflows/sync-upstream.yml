name: sync-upstream
# 把 delightedMaster/uma-so（朋友维护的主线）镜像回本仓。
#
# 注意：GITHUB_TOKEN **不能**改 `.github/workflows/*`（GitHub 硬限制，需要 PAT 的
# workflow scope），所以这里只镜像 `hachimi_ura_plugin/`、`docs/` 与几个顶层文件；
# build-so.yml 已按上游内容手工对齐（ci_patch12..19 + patch_gamedata + 上游判据）。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-upstream.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: fetch upstream (delightedMaster/uma-so)
        run: |
          set -e
          git clone --depth 1 https://github.com/delightedMaster/uma-so.git /tmp/up
          echo "upstream head: $(git -C /tmp/up rev-parse --short HEAD)"
          ls /tmp/up/hachimi_ura_plugin | head -40
      - name: mirror plugin tree + docs
        run: |
          set -e
          # 插件目录整体替换（src/、全部 ci_patch*.py、gamedata patch 数据、Cargo.toml）
          rm -rf hachimi_ura_plugin
          cp -a /tmp/up/hachimi_ura_plugin hachimi_ura_plugin
          # 顶层基线与文档
          cp -a /tmp/up/README.md README.md
          cp -a /tmp/up/hlpatch_endpoints.txt hlpatch_endpoints.txt
          cp -a /tmp/up/rust-toolchain.toml rust-toolchain.toml
          rm -rf docs
          cp -a /tmp/up/docs docs
          rm -rf tools
          cp -a /tmp/up/tools tools 2>/dev/null || true
          git status --short | head -60
      - name: commit and push
        run: |
          set -e
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already in sync"
            exit 0
          fi
          git commit -m "chore: 同步 delightedMaster/uma-so（ci_patch12–19 + gamedata patch + docs）"
          git push