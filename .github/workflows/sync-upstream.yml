name: sync-upstream
# 把 delightedMaster/uma-so（朋友维护的主线）镜像回本仓。
#
# 注意：
# 1. GITHUB_TOKEN **不能**改 `.github/workflows/*`（GitHub 硬限制），所以这里只镜像
#    `hachimi_ura_plugin/`、`docs/`、`tools/` 与几个顶层文件；build-so.yml 已手工对齐。
# 2. 用「合并覆盖」而不是「删除重建」——本仓独有的补丁（如 ci_patch20）要保留下来，
#    否则每次同步都会被上游抹掉。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-upstream.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: fetch upstream (delightedMaster/uma-so)
        run: |
          set -e
          git clone --depth 1 https://github.com/delightedMaster/uma-so.git /tmp/up
          echo "upstream head: $(git -C /tmp/up rev-parse --short HEAD)"
          ls /tmp/up/hachimi_ura_plugin | head -40
      - name: merge upstream plugin tree + docs
        run: |
          set -e
          mkdir -p hachimi_ura_plugin
          # 合并覆盖：上游文件更新到最新，本仓独有文件（ci_patch20.py 等）保留
          cp -a /tmp/up/hachimi_ura_plugin/. hachimi_ura_plugin/
          cp -a /tmp/up/README.md README.md
          cp -a /tmp/up/hlpatch_endpoints.txt hlpatch_endpoints.txt
          cp -a /tmp/up/rust-toolchain.toml rust-toolchain.toml
          mkdir -p docs tools
          cp -a /tmp/up/docs/. docs/
          cp -a /tmp/up/tools/. tools/ 2>/dev/null || true
          echo "--- 本仓独有（上游没有）的补丁 ---"
          for f in hachimi_ura_plugin/ci_patch*.py; do
            b=$(basename "$f")
            [ -f "/tmp/up/hachimi_ura_plugin/$b" ] || echo "  local-only: $b"
          done
          git status --short | head -60
      - name: commit and push
        run: |
          set -e
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already in sync"
            exit 0
          fi
          git commit -m "chore: 同步 delightedMaster/uma-so（合并覆盖，保留本仓独有补丁）"
          git push