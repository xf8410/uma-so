name: build-so
on:
  workflow_dispatch:
    inputs:
      with_matsuri:
        description: "编译 matsuri 决策栈"
        required: false
        default: "true"
  push:
    paths:
      - "hachimi_ura_plugin/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: ndk env
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: vendor matsuri + engine
        run: |
          set -e
          git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git vendor/matsuri
          cd vendor/matsuri
          git submodule update --init --depth 1 umaai_next || {
            rm -rf umaai_next
            git clone --depth 1 https://github.com/umaai-project/umaai-next.git umaai_next
          }
          ls umaai_next/crates; echo "---"; ls crates; echo "---"; ls -la data
      - name: vendor gamedata
        run: |
          set -e
          rm -rf vendor/gamedata
          mkdir -p vendor/gamedata
          cp -v vendor/matsuri/umaai_next/gamedata/*.json vendor/gamedata/
          for f in constants.json umaDB.json cardDB.json events.json text_data_dict.json manifest.json; do
            test -s "vendor/gamedata/$f" || { echo "missing gamedata/$f"; exit 1; }
          done
          for f in scenario_matsuri.json matsuri_config.toml ai_config.toml; do
            test -s "vendor/matsuri/data/$f" || { echo "missing matsuri/data/$f"; exit 1; }
          done
      - name: patch engine workspace overrides
        run: |
          set -e
          grep -rn "default-features = false" vendor/matsuri/umaai_next/crates/*/Cargo.toml || true
          sed -i -E "s/(=[[:space:]]*\{ *workspace *= *true *), *default-features *= *false/\1/" vendor/matsuri/umaai_next/crates/*/Cargo.toml
      - name: patch lib.rs
        working-directory: hachimi_ura_plugin
        run: |
          for p in ci_patch.py ci_patch2.py ci_patch3.py ci_patch4.py ci_patch5.py \
                   ci_patch6.py ci_patch7.py ci_patch8.py ci_patch9.py ci_patch10.py \
                   ci_patch11.py ci_patch12_pre.py ci_patch12.py; do
            echo "--- $p"
            python3 "$p" 2>&1 | tee -a /tmp/patch.log
            test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::patch failed: $p"; exit 1; }
          done
          echo "--- 锚点落地检查 ---"
          for k in "mod matsuri_bridge" "fn build_matsuri_frame" "fn dump_omakase_tables" \
                   "fn get_base_weight_hook" "fn install_selector_hooks" \
                   "fn wb_override_lookup" "fn find_method_entry" \
                   "fn mt_recompute" "fn mt_weight_for_arg" "fn mt_read_identity" \
                   "fn read_inline_obscured_int_array" "fn mt_thread_attach" \
                   "fn push_read_enabled" "has_act_candidates" \
                   "fn mt_deck_raw_json" "fn mt_start_worker" "matsuri-worker" \
                   "dataset_missing" "MT_LAST_HIT" "chara_class_mismatch"; do
            c=$(grep -c "$k" src/lib.rs)
            echo "  $k: $c"
            test "$c" -ge 1 || { echo "::error::missing $k"; exit 1; }
          done
      - name: build
        working-directory: hachimi_ura_plugin
        run: |
          set +e
          FEAT=""
          if [ "${{ inputs.with_matsuri }}" != "false" ]; then FEAT="--features matsuri"; fi
          cargo build --release --color never --target aarch64-linux-android $FEAT > /tmp/build.log 2>&1
          RC=$?
          echo "cargo exit=$RC log_lines=$(wc -l < /tmp/build.log)"
          if [ $RC -ne 0 ]; then
            grep -nE "^error|error\[E" /tmp/build.log | head -40
            exit 1
          fi
          SO=target/aarch64-linux-android/release/libhachimi_ura.so
          ls -la "$SO"; sha256sum "$SO"
          echo "so_size=$(stat -c%s "$SO")" | tee /tmp/size.txt
      - name: verify
        working-directory: hachimi_ura_plugin
        run: |
          set -e
          SO=target/aarch64-linux-android/release/libhachimi_ura.so
          SIZE=$(stat -c%s "$SO")
          echo "so_size=$SIZE" | tee /tmp/size.txt
          for k in api/ai/status api/ai/init api/ai/frame api/ai/decide api/ai/hooks \
                   api/ai/weights api/ai/tables api/ai/weightcalls api/ai/override \
                   api/ai/entry api/ai/matsuri api/ai/deck api/ai/deckraw matsuri_data; do
            grep -aq "$k" "$SO" || { echo "::error::缺端点 $k"; exit 1; }
            echo "ok: $k"
          done
          for k in handle_frame 候选动作为空 帧解析失败 守门 matsuri-worker \
                   dataset_missing chara_class_mismatch il2cpp_thread_attach \
                   push_read.txt uma_so/matsuri_data; do
            grep -aq "$k" "$SO" || { echo "::error::决策链/门禁被裁: $k"; exit 1; }
            echo "ok: $k"
          done
          for k in omakase_command_null dict_null no_mdm_singleton weight_override.txt \
                   find_method_entry trampoline_miss; do
            grep -aq "$k" "$SO" || { echo "::error::权重层被裁: $k"; exit 1; }
            echo "ok: $k"
          done
          if [ "${{ inputs.with_matsuri }}" != "false" ] && [ "$SIZE" -lt 9000000 ]; then
            echo "::error::so 只有 $SIZE 字节"; exit 1
          fi
          echo "verify passed: $SIZE bytes"
      - name: dump error to repo
        if: failure()
        run: |
          set +e
          {
            echo "# CI 最近一次失败日志"
            echo; echo "- run: ${{ github.run_id }}"; echo "- sha: ${{ github.sha }}"; echo
            echo '## 大小'; echo '```'; cat /tmp/size.txt 2>/dev/null; echo '```'
            echo '## cargo error'; echo '```'
            grep -nE "^error|error\[E" /tmp/build.log 2>/dev/null | head -40
            echo '```'
            echo '## cargo 尾部'; echo '```'; tail -60 /tmp/build.log 2>/dev/null; echo '```'
            echo '## patch 尾部'; echo '```'; tail -50 /tmp/patch.log 2>/dev/null; echo '```'
          } > docs/CI_LAST_ERROR.md
          git config user.name "ci-bot"; git config user.email "ci@local"
          git add docs/CI_LAST_ERROR.md
          git commit -m "ci: 记录失败日志 ${GITHUB_SHA:0:8}" || true
          git push || true
      - name: publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd hachimi_ura_plugin
          VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          TAG="${{ inputs.with_matsuri == 'false' && 'builds-lite' || 'builds' }}"
          OUT="libhachimi_ura-${VER}-${GITHUB_SHA:0:8}.so"
          cp target/aarch64-linux-android/release/libhachimi_ura.so "/tmp/$OUT"
          cd /tmp
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "SO $TAG" --notes "auto"
          gh release upload "$TAG" "/tmp/$OUT" -R "$GITHUB_REPOSITORY" --clobber
          sha256sum "/tmp/$OUT"