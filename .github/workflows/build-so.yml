name: build-so
on:
  workflow_dispatch:
    inputs:
      with_matsuri:
        description: "编译 matsuri 决策栈"
        required: false
        default: "true"
  push:
    paths:
      - "hachimi_ura_plugin/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: ndk env
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: vendor matsuri + engine
        run: |
          set -e
          git clone --depth 1 https://github.com/umaai-project/umaai-matsuri.git vendor/matsuri
          cd vendor/matsuri
          git submodule update --init --depth 1 umaai_next || {
            echo "submodule failed, fallback to direct clone"
            rm -rf umaai_next
            git clone --depth 1 https://github.com/umaai-project/umaai-next.git umaai_next
          }
          echo "--- engine crates ---"
          ls umaai_next/crates
          echo "--- matsuri crates ---"
          ls crates
          echo "--- matsuri data ---"
          ls -la data
      - name: vendor gamedata (引擎六表，供 include_str! 内嵌)
        run: |
          set -e
          rm -rf vendor/gamedata
          mkdir -p vendor/gamedata
          cp -v vendor/matsuri/umaai_next/gamedata/*.json vendor/gamedata/
          ls -la vendor/gamedata
          for f in constants.json umaDB.json cardDB.json events.json text_data_dict.json manifest.json; do
            test -s "vendor/gamedata/$f" || { echo "missing gamedata/$f"; exit 1; }
          done
          for f in scenario_matsuri.json matsuri_config.toml ai_config.toml; do
            test -s "vendor/matsuri/data/$f" || { echo "missing matsuri/data/$f"; exit 1; }
          done
      - name: patch engine workspace overrides
        run: |
          set -e
          echo "--- 需要 patch 的 default-features 覆盖 ---"
          grep -rn "default-features = false" vendor/matsuri/umaai_next/crates/*/Cargo.toml || true
          sed -i -E "s/(=[[:space:]]*\{ *workspace *= *true *), *default-features *= *false/\1/" vendor/matsuri/umaai_next/crates/*/Cargo.toml
          grep -rn "default-features" vendor/matsuri/umaai_next/crates/*/Cargo.toml || true
      - name: patch lib.rs（挂 matsuri_bridge 与两个端点）
        working-directory: hachimi_ura_plugin
        run: |
          python3 - <<'PY'
          import sys
          p = "src/lib.rs"
          s = open(p, encoding="utf-8").read()

          # 1) 模块声明
          n = "mod ui_rename;"
          c = s.count(n)
          if c != 1:
              sys.exit(f"mod ui_rename; count={c}")
          s = s.replace(n, n + '\n#[cfg(feature = "matsuri")]\nmod matsuri_bridge;', 1)

          # 2) ENDPOINTS 注册（第一处 = const ENDPOINTS）
          n = '    "/scenario",'
          if s.count(n) < 1:
              sys.exit("ENDPOINTS anchor missing")
          s = s.replace(n, n + '\n    "/api/ai/status",\n    "/api/ai/init",', 1)

          # 3) 路由分支
          anchor = '    } else if path == "/scenario" {'
          c = s.count(anchor)
          if c != 1:
              sys.exit(f"route anchor count={c}")
          block = '''    } else if path == "/api/ai/status" {
        #[cfg(feature = "matsuri")]
        {
            matsuri_bridge::status_json()
        }
        #[cfg(not(feature = "matsuri"))]
        {
            r#"{"ok":false,"error":"matsuri_feature_off"}"#.to_string()
        }
    } else if path == "/api/ai/init" {
        #[cfg(feature = "matsuri")]
        {
            // 配置：/sdcard/Download/uma_so/matsuri_uma.txt
            //   uma=101301
            //   cards=303174,303114,303004,303224,303204,303234
            //   seed=61444
            let mut uma = 0u32;
            let mut seed = 61444u64;
            let mut cards: Vec<u32> = Vec::new();
            if let Ok(text) = std::fs::read_to_string("/sdcard/Download/uma_so/matsuri_uma.txt") {
                for line in text.lines() {
                    let line = line.trim();
                    if line.is_empty() || line.starts_with('#') {
                        continue;
                    }
                    if let Some(v) = line.strip_prefix("uma=") {
                        uma = v.trim().parse().unwrap_or(0);
                    } else if let Some(v) = line.strip_prefix("seed=") {
                        seed = v.trim().parse().unwrap_or(61444);
                    } else if let Some(v) = line.strip_prefix("cards=") {
                        cards = v
                            .split(',')
                            .filter_map(|x| x.trim().parse::<u32>().ok())
                            .collect();
                    }
                }
            }
            match matsuri_bridge::init(uma, &cards, seed) {
                Ok(()) => format!(
                    r#"{{"ok":true,"uma":{},"cards":{},"seed":{}}}"#,
                    uma,
                    cards.len(),
                    seed
                ),
                Err(e) => format!(r#"{{"ok":false,"error":"{}"}}"#, e.replace('"', "'")),
            }
        }
        #[cfg(not(feature = "matsuri"))]
        {
            r#"{"ok":false,"error":"matsuri_feature_off"}"#.to_string()
        }
'''
          s = s.replace(anchor, block + anchor, 1)

          open(p, "w", encoding="utf-8").write(s)
          print("patched lib.rs:", len(s), "bytes")
          PY
          grep -n "mod matsuri_bridge" src/lib.rs
          grep -n "api/ai/status" src/lib.rs | head -3
      - name: build
        working-directory: hachimi_ura_plugin
        run: |
          set +e
          FEAT=""
          if [ "${{ inputs.with_matsuri }}" != "false" ]; then FEAT="--features matsuri"; fi
          cargo build --release --color never --target aarch64-linux-android $FEAT > /tmp/build.log 2>&1
          RC=$?
          echo "cargo exit=$RC log_lines=$(wc -l < /tmp/build.log)"
          if [ $RC -ne 0 ]; then
            LN=$(grep -nE "^error" /tmp/build.log | head -1 | cut -d: -f1)
            echo "first_error=${LN:-none}"
            if [ -n "$LN" ]; then awk -v s="$LN" 'NR>=s-1 && NR<=s+30' /tmp/build.log; else tail -60 /tmp/build.log; fi
            exit 1
          fi
          ls -la target/aarch64-linux-android/release/libhachimi_ura.so
          sha256sum target/aarch64-linux-android/release/libhachimi_ura.so
          SIZE=$(stat -c%s target/aarch64-linux-android/release/libhachimi_ura.so)
          echo "so_size=$SIZE"
          if [ "${{ inputs.with_matsuri }}" != "false" ]; then
            if [ "$SIZE" -lt 7000000 ]; then
              echo "::error::so 只有 $SIZE 字节 —— matsuri 决策栈没被链接进来（内嵌数据约 7MB）"
              exit 1
            fi
            echo "--- 关键字符串自检 ---"
            for k in scenario_matsuri matsuri_bridge api/ai/status; do
              if grep -aq "$k" target/aarch64-linux-android/release/libhachimi_ura.so; then
                echo "found: $k"
              else
                echo "::error::未找到 $k —— 该功能没进产物"
                exit 1
              fi
            done
          fi
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd hachimi_ura_plugin
          VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          TAG="${{ inputs.with_matsuri == 'false' && 'builds-lite' || 'builds' }}"
          OUT="libhachimi_ura-${VER}-${GITHUB_SHA:0:8}.so"
          cp target/aarch64-linux-android/release/libhachimi_ura.so "/tmp/$OUT"
          cd /tmp
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "SO $TAG" --notes "auto"
          gh release upload "$TAG" "/tmp/$OUT" -R "$GITHUB_REPOSITORY" --clobber
          sha256sum "/tmp/$OUT"