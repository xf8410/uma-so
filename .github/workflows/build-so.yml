name: build-so
on:
  workflow_dispatch:
  push:
    paths:
      - "hachimi_ura_plugin/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: ndk env
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "using NDK=$NDK"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: build release so
        working-directory: hachimi_ura_plugin
        run: |
          cargo build --release --target aarch64-linux-android 2>&1 | tail -30
          SO=target/aarch64-linux-android/release/libhachimi_ura.so
          ls -la "$SO"
          sha256sum "$SO"
      - name: publish to release tag builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd hachimi_ura_plugin
          VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          OUT="libhachimi_ura-${VER}-festafix.so"
          cp "target/aarch64-linux-android/release/libhachimi_ura.so" "/tmp/$OUT"
          cd /tmp
          gh release view builds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create builds -R "$GITHUB_REPOSITORY" --title "SO builds" --notes "自动构建：含 scenario 15 (Festa) 映射 + B1 并发修复"
          gh release upload builds "/tmp/$OUT" -R "$GITHUB_REPOSITORY" --clobber
          echo "=== uploaded ==="
          sha256sum "/tmp/$OUT"
