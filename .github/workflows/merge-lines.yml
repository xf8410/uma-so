name: merge-lines
on:
  workflow_dispatch:
    inputs:
      left: {description: "来源分支 A（hlpatch 上游）", required: true, default: "workbench/rng-consumption-probe-3.29.1"}
      right: {description: "来源分支 B（hlpatch 上游）", required: true, default: "workbench/resource-hooks-and-strip-factor"}
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git identity
        run: |
          git config user.name  "merge-bot"
          git config user.email "merge-bot@users.noreply.github.com"
      - name: fetch upstream
        run: |
          git remote add upstream https://github.com/uma-shiyanshi/hlpatch.git
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*'
      - name: dry merge
        env:
          L: ${{ inputs.left }}
          R: ${{ inputs.right }}
        run: |
          set -e
          git checkout -B "merge/${L}-x-${R}" "upstream/${L}"
          if ! git merge --no-commit --no-ff "upstream/${R}"; then
            echo CONFLICT | tee conflict.flag
            git diff --name-only --diff-filter=U | tee conflicts.txt
            git merge --abort || true
            exit 1
          fi
      - name: upload conflict report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conflicts
          path: |
            conflicts.txt
            conflict.flag
          if-no-files-found: ignore
      - name: commit and push
        if: success()
        env:
          L: ${{ inputs.left }}
          R: ${{ inputs.right }}
        run: |
          set -e
          git add -A
          git commit -m "merge: ${L} + ${R}"
          git push origin "HEAD:refs/heads/merge/${L}-x-${R}"
      - name: cargo check
        if: success()
        run: |
          rustup target add aarch64-linux-android
          cd hachimi_ura_plugin && cargo check --target aarch64-linux-android 2>&1 | tail -40
      - name: open PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          L: ${{ inputs.left }}
          R: ${{ inputs.right }}
        run: |
          gh pr create --base main --head "merge/${L}-x-${R}" \
            --title "merge: ${L} + ${R}" \
            --body "三方合并产物；cargo check 通过后人工审端点表与 hook 同址冲突。" || true
